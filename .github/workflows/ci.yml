name: CI

on:
  push:
    branches: [main, phase-1-core-learning-flow]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test SLO curriculum sync tooling
        run: python3 scripts/test_sync_slo_curriculum.py
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @leersprong/web typecheck
      - run: pnpm --filter @leersprong/web test
      - run: pnpm --filter @leersprong/web build
